name: Veri güncelleme

# Takvimi çeker, hafta dosyalarını üretir ve commit eder.
# Commit "Yayınla" iş akışını tetikler, site yenilenir.
#
# Yapay zeka yorumu için depo ayarlarından bir secret ekle:
#   Settings > Secrets and variables > Actions > New repository secret
#   Ad: ANTHROPIC_API_KEY
# Secret yoksa yorum adımları atlanır, takvim yine güncellenir.

on:
  schedule:
    # Pazar 06:00 UTC = 09:00 TRT: feed yeni haftaya döner, hafta kurulur
    # ve yapay zeka yorumu üretilir.
    - cron: "0 6 * * 0"
    # Cuma 05:00 UTC = 08:00 TRT: gelecek haftanın ön izlemesine yorum
    # eklenir, böylece hafta sonu analizinde hazır olur.
    - cron: "0 5 * * 5"
    # Diğer günler 05:00 UTC = 08:00 TRT: takvim tazelenir.
    - cron: "0 5 * * 1-4,6"
  workflow_dispatch:
  # Elle tetikleme yolu: ayar dosyasi ya da is akisinin kendisi
  # degistiginde veri ve yorumlar yeniden uretilir. Hangi paritelerin
  # yorumlanacagini degistirince yorumun tazelenmesi zaten dogru olan.
  push:
    branches: [main]
    paths:
      - "src/data/cot-watch.json"
      - ".github/workflows/haftalik-veri.yml"

permissions:
  contents: write

jobs:
  guncelle:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Bu haftayı üret
        id: hafta
        run: node scripts/new-week.ts

      # Gelecek hafta ileriye dönük kaynaktan gelir. Kaynak düşerse
      # bu haftanın güncellemesi etkilenmesin.
      - name: Gelecek hafta ön izlemesi
        id: onizleme
        continue-on-error: true
        run: node scripts/new-week.ts --next

      # COT cuma 23:30 TRT'de yayınlanır; cumartesi sabahki çalışma
      # yeni raporu yakalar. Script yeni rapor geldiğini çıktı olarak
      # bildirir, yorum yalnızca o zaman üretilir.
      - name: COT raporu
        id: cot
        continue-on-error: true
        run: node scripts/fetch-cot.ts

      # Yeni rapor geldiğinde kendiliğinden; elle çalıştırmada her zaman,
      # böylece beklemeden deneyebilirsin.
      - name: Yorum — COT
        if: >-
          env.ANTHROPIC_API_KEY != '' &&
          (github.event_name == 'workflow_dispatch' ||
           github.event_name == 'push' ||
           steps.cot.outputs.cot_new == 'true')
        run: node scripts/ai-cot.ts

      # Bu haftanın yorumu yalnızca pazar kurulumunda ve elle çalıştırmada.
      - name: Yorum — bu hafta
        if: >-
          env.ANTHROPIC_API_KEY != '' &&
          steps.hafta.outputs.week_id != '' &&
          (github.event_name == 'workflow_dispatch' ||
           github.event.schedule == '0 6 * * 0')
        run: node scripts/ai-commentary.ts --id ${{ steps.hafta.outputs.week_id }}

      # Ön izlemenin yorumu cuma günü üretilir: hafta sonu analizinde hazır.
      - name: Yorum — gelecek hafta
        if: >-
          env.ANTHROPIC_API_KEY != '' &&
          steps.onizleme.outputs.week_id != '' &&
          (github.event_name == 'workflow_dispatch' ||
           github.event.schedule == '0 5 * * 5')
        run: node scripts/ai-commentary.ts --id ${{ steps.onizleme.outputs.week_id }}

      - name: Değişiklikleri işle
        run: |
          git config user.name "sismograf"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/weeks src/data/cot src/data/ai-usage.json
          if git diff --staged --quiet; then
            echo "Yeni veri yok."
          else
            git commit -m "Takvim ve COT güncellemesi"
            git push
          fi
