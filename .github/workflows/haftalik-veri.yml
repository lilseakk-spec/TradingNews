name: Veri güncelleme

# Pazar sabahı takvimi çeker, hafta dosyasını üretir ve commit eder.
# Commit push edilince "Yayınla" iş akışı siteyi yeniler.
#
# Yapay zeka yorumu için depo ayarlarından bir secret ekle:
#   Settings > Secrets and variables > Actions > New repository secret
#   Ad: ANTHROPIC_API_KEY
# Secret yoksa o adım atlanır, takvim yine güncellenir.

on:
  schedule:
    # Pazar 06:00 UTC = 09:00 TRT: feed yeni haftaya döner, hafta kurulur
    # ve yapay zeka yorumu üretilir.
    - cron: "0 6 * * 0"
    # Diğer günler 05:00 UTC = 08:00 TRT: takvim tazelenir. Hafta içinde
    # saatler kayar, beklentiler güncellenir, yeni olay eklenir.
    - cron: "0 5 * * 1-6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  guncelle:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Takvimi çek ve haftayı üret
        run: node scripts/new-week.ts

      # Yorum yalnızca pazar kurulumunda ve elle çalıştırmada üretilir;
      # hafta içi tazelemede mevcut yorum korunur.
      - name: Yapay zeka yorumu
        if: >-
          env.ANTHROPIC_API_KEY != '' &&
          (github.event_name == 'workflow_dispatch' ||
           github.event.schedule == '0 6 * * 0')
        run: node scripts/ai-commentary.ts

      - name: Değişiklikleri işle
        run: |
          git config user.name "sismograf"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/weeks
          if git diff --staged --quiet; then
            echo "Yeni veri yok."
          else
            git commit -m "Takvim güncellemesi"
            git push
          fi
